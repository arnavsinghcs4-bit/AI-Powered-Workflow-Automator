services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_POOLED_URL=${SUPABASE_POOLED_URL}
      - REDIS_URL=redis://redis:6380
      - JWT_SECRET=${JWT_SECRET}
      - ENV=${ENV:-dev}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      backend/scripts/wait-for-db.sh &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SUPABASE_POOLED_URL=${SUPABASE_POOLED_URL}
      - REDIS_URL=redis://redis:6380
      - JWT_SECRET=${JWT_SECRET}
      - ENV=${ENV:-dev}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      backend/scripts/wait-for-db.sh &&
      celery -A app.worker.celery_app worker --loglevel=info
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
